name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]          # pushing a tag like v1.2.0 builds everything and publishes a GitHub Release
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "To publish a release, enter a version tag such as v1.2.0 (leave empty for a normal build)"
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15-intel
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Windows
            os: windows-latest
            cmake_extra: ""
          - name: Linux
            os: ubuntu-24.04
            cmake_extra: -DMB_BUILD_HOST_CHECK=ON
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libfontconfig1-dev ninja-build xvfb

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: DSP tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Host + processor checks (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a ./build/mb_host_check_artefacts/Release/mb_host_check "build/MasterBlaster_artefacts/Release/VST3/Master Blaster.vst3"
          xvfb-run -a ./build/mb_ui_snapshot_artefacts/Release/mb_ui_snapshot ui.png

      - name: pluginval (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 8 --validate "build/MasterBlaster_artefacts/Release/VST3/Master Blaster.vst3"

      - name: pluginval (macOS, VST3 + AU)
        if: runner.os == 'macOS'
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate "build/MasterBlaster_artefacts/Release/VST3/Master Blaster.vst3"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/MasterBlaster_artefacts/Release/AU/Master Blaster.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Mbm1 Mbls

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -R "build/MasterBlaster_artefacts/Release/VST3/Master Blaster.vst3" dist/
          if [ -d "build/MasterBlaster_artefacts/Release/AU" ]; then cp -R "build/MasterBlaster_artefacts/Release/AU/Master Blaster.component" dist/; fi

      - name: Zip for release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p release
          ver="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          name="MasterBlaster-${ver//\//-}-${{ matrix.name }}.zip"
          if [ "$RUNNER_OS" = "macOS" ]; then
            # ditto keeps the bundles' metadata intact
            ditto -c -k --sequesterRsrc dist "release/$name"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "release/$name" ./dist/*
          else
            (cd dist && zip -qr "../release/$name" .)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MasterBlaster-${{ matrix.name }}
          path: dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release

  release:
    # Publishes a GitHub Release after all three platforms built and passed their checks.
    # Two ways to start it:
    #   - Actions tab -> Build -> Run workflow, enter a tag such as v1.2.0 (no command line needed)
    #   - push a tag:  git tag v1.2.0 && git push origin v1.2.0
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency: release-${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          ls -l release
          case "$TAG" in v[0-9]*) ;; *) echo "Release tag must look like v1.2.0, got '$TAG'"; exit 1 ;; esac
          notes="Unsigned builds. macOS: copy the .component to ~/Library/Audio/Plug-Ins/Components and the .vst3 to ~/Library/Audio/Plug-Ins/VST3, then run: xattr -dr com.apple.quarantine on both. Windows: copy the .vst3 to C:\\Program Files\\Common Files\\VST3. Linux: copy the .vst3 to ~/.vst3."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Release already exists (e.g. created on the website): just attach or refresh the zips.
            gh release upload "$TAG" release/*.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            # Creates the tag at the commit that was just built and tested.
            gh release create "$TAG" release/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Master Blaster $TAG" \
              --generate-notes \
              --notes "$notes"
          fi
